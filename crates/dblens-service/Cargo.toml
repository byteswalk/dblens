[package]
name = "dblens-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["mysql", "postgres", "oracle", "dameng", "sqlserver", "informix"]
mysql = ["dep:dblens-driver-mysql"]
postgres = ["dep:dblens-driver-postgres"]
oracle = ["dep:dblens-driver-oracle"]
dameng = ["dep:dblens-driver-dameng"]
sqlserver = ["dep:dblens-driver-sqlserver"]
informix = ["dep:dblens-driver-jdbc"]
# 公开测试用的假驱动 `fake`
testing = []

[dependencies]
argon2.workspace = true
async-trait.workspace = true
base64.workspace = true
chacha20poly1305.workspace = true
calamine.workspace = true
chrono.workspace = true
csv.workspace = true
dblens-core.workspace = true
dblens-dialect.workspace = true
dblens-lint.workspace = true
dblens-driver.workspace = true
dblens-driver-dameng = { workspace = true, optional = true }
dblens-driver-mysql = { workspace = true, optional = true }
dblens-driver-oracle = { workspace = true, optional = true }
dblens-driver-postgres = { workspace = true, optional = true }
dblens-driver-sqlserver = { workspace = true, optional = true }
dblens-driver-jdbc = { workspace = true, optional = true }
directories.workspace = true
encoding_rs.workspace = true
encoding_rs_io.workspace = true
keyring.workspace = true
minijinja = { workspace = true, features = ["serde"] }
quick-xml.workspace = true
rusqlite.workspace = true
rust_xlsxwriter.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sqlparser.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
csv.workspace = true
insta.workspace = true
tempfile.workspace = true
