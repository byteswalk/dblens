[workspace]
resolver = "3"
members = ["crates/*"]
# 打了补丁的第三方库（见 vendor/PATCHES.md），不作为工作区成员检查
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
dblens-core = { path = "crates/dblens-core" }
dblens-driver = { path = "crates/dblens-driver" }
dblens-api = { path = "crates/dblens-api" }
dblens-dialect = { path = "crates/dblens-dialect" }
dblens-desktop = { path = "crates/dblens-desktop" }
dblens-server = { path = "crates/dblens-server" }
dblens-service = { path = "crates/dblens-service" }
dblens-driver-dameng = { path = "crates/dblens-driver-dameng" }
dblens-driver-mysql = { path = "crates/dblens-driver-mysql" }
dblens-driver-oracle = { path = "crates/dblens-driver-oracle" }
dblens-driver-postgres = { path = "crates/dblens-driver-postgres" }
dblens-driver-sqlserver = { path = "crates/dblens-driver-sqlserver" }

argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
bytes = "1.12.1"
calamine = { version = "0.37.0", default-features = false, features = ["chrono"] }
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
csv = "1.4.0"
directories = "6.0.0"
encoding_rs = "0.8.42"
encoding_rs_io = "0.1.8"
futures = "0.3.34"
http-body-util = "0.1.5"
insta = "1.49.0"
keyring = "4.2.0"
libloading = "0.9.0"
minijinja = "3.0.3"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls"] }
oracle = { version = "0.6.3", features = ["chrono"] }
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rust_xlsxwriter = { version = "0.101.0", default-features = false, features = ["constant_memory", "chrono"] }
rust-i18n = "4.2.4"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["serialize", "deserialize"] }
sqlparser = "0.63.0"
sys-locale = "0.3.2"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
# SQL Server：替换为 vendor/ 中打了补丁的版本（见 vendor/PATCHES.md）
tiberius = { version = "0.13.0", default-features = false, features = ["tds80", "rustls", "chrono", "sql-browser-tokio", "winauth"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = "0.14.0"
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["compat"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
webpki-roots = "1.0.11"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

# 打了补丁的第三方库（见 vendor/PATCHES.md）：openGauss 的 SHA256 认证；SQL Server 的影响行数和 INFO 消息
[patch.crates-io]
postgres-protocol = { path = "vendor/postgres-protocol" }
tiberius = { path = "vendor/tiberius" }
tokio-postgres = { path = "vendor/tokio-postgres" }
