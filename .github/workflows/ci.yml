name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 检查（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链（读取 rust-toolchain.toml）
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  integration:
    name: 驱动集成测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dblens
          MYSQL_DATABASE: dblens_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdblens"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dblens
          MARIADB_DATABASE: dblens_test
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dblens
          POSTGRES_DB: dblens_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DBLENS_TEST_MYSQL_URL: mysql://root:dblens@127.0.0.1:3306/dblens_test
      DBLENS_TEST_MARIADB_URL: mysql://root:dblens@127.0.0.1:3307/dblens_test
      DBLENS_TEST_PG_URL: postgres://postgres:dblens@127.0.0.1:5432/dblens_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: 运行驱动一致性测试（不允许跳过）
        run: |
          cargo test -p dblens-driver-mysql -p dblens-driver-postgres --test conformance -- --nocapture 2>&1 | tee test.log
          if grep -q "跳过" test.log; then echo "有测试被跳过，环境变量未生效"; exit 1; fi

  oracle:
    name: Oracle 驱动集成测试
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: dblens
          APP_USER: dblens
          APP_USER_PASSWORD: dblens
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      DBLENS_TEST_ORACLE_URL: oracle://dblens:dblens@127.0.0.1:1521/FREEPDB1?oracle_client_lib_dir=/opt/oracle/instantclient
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Oracle Instant Client
        run: |
          sudo apt-get update && sudo apt-get install -y libaio1t64 unzip
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          curl -sSLo /tmp/ic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basiclite-linuxx64.zip
          sudo mkdir -p /opt/oracle && sudo unzip -q /tmp/ic.zip -d /opt/oracle
          sudo ln -sfn "$(ls -d /opt/oracle/instantclient_* | head -1)" /opt/oracle/instantclient
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: 运行 Oracle 一致性测试（不允许跳过）
        run: |
          cargo test -p dblens-driver-oracle -- --nocapture 2>&1 | tee test.log
          if grep -q "跳过" test.log; then echo "有测试被跳过，环境变量未生效"; exit 1; fi
